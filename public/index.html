<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semaphore Lab</title>
<style>
:root{
  --paper:#F2F5F9; --panel:#FFFFFF; --ink:#14233B; --ink2:#4E5E76; --rule:#D2DAE4;
  --stop:#C42E29; --clear:#1B8757; --amber:#B97F08; --blue:#2859AC;
  --wash-stop:#FBE7E6; --wash-clear:#E2F3EA; --wash-amber:#FAF0D4; --wash-blue:#E3EBF8; --rail:#14233B;
  --display:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;letter-spacing:.2px}
code{font-family:var(--mono);font-size:.92em;background:#E8EDF4;padding:1px 5px;border-radius:3px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2859AC;outline-offset:2px}
.muted{color:var(--ink2)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* ---------- rail: the line with its stations ---------- */
.rail{background:var(--rail);color:#D5DEEC;position:sticky;top:0;height:100vh;padding:26px 18px 20px 26px;display:flex;flex-direction:column;overflow:auto}
.brand h1{font-size:23px;color:#fff;line-height:1.1}
.brand p{margin:4px 0 0;font-size:13px;color:#9FB0C9}
.stations{list-style:none;margin:30px 0 0;padding:0;position:relative}
.stations::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:3px;background:#3A4D6B}
.stations li{position:relative}
.stations li.gap{margin-top:22px}
.station{display:block;width:100%;text-align:left;background:none;border:0;color:#C3CFE2;padding:8px 6px 8px 30px;position:relative;font-size:15px;border-radius:3px}
.station::before{content:"";position:absolute;left:0;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:var(--rail);border:3px solid #6C82A5}
.station:hover{color:#fff;background:#1E3150}
.station[aria-current="page"]{color:#fff;font-weight:600}
.station[aria-current="page"]::before{background:var(--clear);border-color:#fff}
.rail-note{margin:auto 0 0;padding-top:24px;font-size:12.5px;line-height:1.45;color:#9FB0C9}

/* ---------- main ---------- */
main{padding:28px 34px 70px;max-width:1320px;width:100%}
.view{display:none}
.view.active{display:block}
.vhead h2{font-size:31px;line-height:1.15}
.lede{max-width:72ch;margin:8px 0 0;color:var(--ink2);font-size:16px}
.btn{border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:3px;padding:7px 16px;font-weight:600}
.btn:hover{background:#E9EEF5}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1F4A92}
.btn.primary small{color:#DCE6F8}
.tbtns .btn.primary small{color:#DCE6F8}
.btn.big{padding:11px 22px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin:20px 0 20px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.controls label.f{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);gap:3px;max-width:190px}
.controls input[type=number]{width:96px;padding:6px 8px;border:1.5px solid var(--rule);border-radius:3px;font:inherit;color:var(--ink);background:#fff}
.controls label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;max-width:260px;font-weight:600}
.controls .actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.badge{display:inline-block;padding:3px 11px;border-radius:3px;font-weight:700;font-size:13.5px;background:#E6EBF2;color:var(--ink2);min-width:84px;text-align:center}
.badge.running{background:var(--wash-blue);color:var(--blue)}
.badge.pass{background:var(--wash-clear);color:var(--clear)}
.badge.fail,.badge.deadlock{background:var(--wash-stop);color:var(--stop)}
.badge.cancelled{background:var(--wash-amber);color:var(--amber)}

.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start}
.stage{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:22px;min-height:380px}
.stage h3{font-size:17px;margin-bottom:8px}
.side section+section{margin-top:22px}
.side h3{font-size:17px;padding-top:10px;border-top:3px solid var(--ink);margin-bottom:8px}
.verify ul{list-style:none;margin:0;padding:0}
.verify li{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:14px}
.verify .mk{font-weight:800}
.verify li.ok .mk{color:var(--clear)} .verify li.bad .mk{color:var(--stop)} .verify li.info .mk{color:var(--blue)}
.verify .d{display:block;color:var(--ink2);font-size:12.5px}
.stats{margin:10px 0 0;font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.stats dt{color:var(--ink2)} .stats dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;margin-bottom:6px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:4px 10px 4px 0;margin-right:10px;color:var(--ink2);font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
ol.events{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;font:12.5px/1.5 var(--mono);border:1px solid var(--rule);background:#fff}
ol.events li{display:grid;grid-template-columns:50px 74px 1fr;gap:6px;padding:2px 8px;border-bottom:1px solid #EEF1F6}
ol.events time{color:#8A98AD}
ol.events b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.events .k-block,ol.events .k-timeout,ol.events .k-abort{color:var(--stop)}
ol.events .k-violation,ol.events .k-deadlock{color:var(--stop);font-weight:700;background:var(--wash-stop)}
ol.events .k-eat,ol.events .k-consume,ol.events .k-ok,ol.events .k-handoff{color:var(--clear)}
ol.events .empty{display:block;grid-column:1/-1;color:var(--ink2);padding:10px;font-family:var(--body);font-size:13.5px}
.watch{margin:26px 0 0;padding:0 0 0 20px;max-width:90ch;color:var(--ink2)}
.watch li{margin:4px 0}

/* ---------- the signal gauge (the memorable element) ---------- */
.gauges{display:flex;flex-wrap:wrap;gap:12px 26px;margin-bottom:18px}
.sig{display:flex;align-items:center;gap:8px;min-width:150px}
.sig svg{flex:none}
.sig .arm{fill:var(--stop)} .sig .lamp{fill:var(--stop)} .sig.clear .arm,.sig.clear .lamp{fill:var(--clear)}
.sig svg g{transition:transform .22s ease}
.sig-txt{display:flex;flex-direction:column;line-height:1.2}
.sig-name{font-family:var(--display);font-size:15px;font-weight:600}
.sig-val{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.sig-q{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:3px;margin-top:3px;min-height:14px}
.sig-q i{display:inline-block;width:11px;height:8px;background:var(--stop);border-radius:1px}
.sig-q em{font-style:normal;font-weight:700;color:var(--stop)}
.sig.big svg{width:64px;height:64px}.sig.big .sig-val{font-size:44px}

/* ---------- actors ---------- */
ul.actors{list-style:none;margin:0;padding:0}
.actor{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.dot{width:11px;height:11px;border-radius:50%;background:#AEBBCD}
.st-working .dot,.st-idle .dot,.st-thinking .dot{background:#AEBBCD}
.st-blocked .dot,.st-waiting .dot,.st-deadlocked .dot{background:var(--stop)}
.st-active .dot,.st-reading .dot,.st-eating .dot,.st-writing .dot{background:var(--clear)}
.st-hungry .dot{background:#E3A720}
.st-done .dot{background:var(--ink)}
.actor .who{display:flex;flex-direction:column;line-height:1.25}
.actor .who small{color:var(--ink2);font-size:12.5px}
.actor .stt{font-size:13px;color:var(--ink2);text-align:right}
.st-blocked .stt,.st-waiting .stt,.st-deadlocked .stt{color:var(--stop);font-weight:700}
.st-active .stt,.st-reading .stt,.st-eating .stt,.st-writing .stt{color:var(--clear);font-weight:700}

/* ---------- race ---------- */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lane{border:2px solid var(--rule);padding:16px;border-radius:3px;transition:border-color .2s}
.lane.active{border-color:var(--blue)}
.big{display:block;font-family:var(--display);font-size:46px;font-weight:700;line-height:1.1;margin-top:4px}
.sub{margin:2px 0 8px;color:var(--ink2);font-size:14px}
.bar{height:12px;background:#E6EBF2;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .1s linear}
.lane[data-lane=u] .bar i{background:var(--amber)}
.verdict{min-height:24px;margin:10px 0 4px;font-weight:700}
.verdict.bad{color:var(--stop)} .verdict.good{color:var(--clear)}
.chips{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.chips li{padding:4px 8px;background:var(--wash-amber);border-radius:2px}
.chips li span{color:var(--ink2)}
.tracks{margin-top:18px;display:grid;gap:5px}
.track{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.track .bar{height:7px}

/* ---------- producer-consumer / readers-writers ---------- */
.pc-grid,.rw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:22px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.slot{width:70px;height:46px;border:2px solid var(--ink);border-radius:3px;display:grid;place-items:center;font:12px var(--mono);background:#fff;color:var(--ink2)}
.slot.full{background:var(--wash-blue);color:var(--ink);font-weight:700;border-color:var(--blue)}
.flow{font-size:14px;color:var(--ink2);margin:6px 0}
.resource{border:3px solid var(--ink);padding:16px 12px;text-align:center;background:#fff;transition:background .15s,border-color .15s}
.resource.reading{background:var(--wash-clear);border-color:var(--clear)}
.resource.writing{background:var(--wash-amber);border-color:var(--amber)}
.resource .rs{font-family:var(--display);font-size:22px;font-weight:700;margin:4px 0}
.resource .data{margin:0;font:13.5px var(--mono);color:var(--ink2)}
.rc,.viol{margin:10px 0 0;font-size:14px}
.viol{font-weight:700;color:var(--clear)} .viol.bad{color:var(--stop);background:var(--wash-stop);padding:3px 6px}

/* ---------- dining ---------- */
.dining{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:22px;align-items:start}
.dining svg{width:100%;height:auto;max-width:440px}
.plate{fill:#fff;stroke:#7D8CA3;stroke-width:3;transition:fill .15s,stroke .15s}
.s-hungry .plate{fill:var(--wash-amber);stroke:#E3A720}
.s-waiting .plate,.s-deadlocked .plate{fill:var(--wash-stop);stroke:var(--stop)}
.s-eating .plate{fill:var(--wash-clear);stroke:var(--clear)}
.s-done .plate{fill:#E1E6EE;stroke:var(--ink)}
.fork{stroke:#8896AB;stroke-width:6;stroke-linecap:round;transition:all .15s}
.fork.held{stroke:#E3A720} .fork.eat{stroke:var(--clear)} .fork.dead{stroke:var(--stop)}
.banner{margin:10px 0 0;padding:10px 12px;background:var(--wash-stop);color:var(--stop);font-weight:700;border-left:5px solid var(--stop)}
.legend{font-size:13px;color:var(--ink2);margin:10px 0 0}

/* ---------- overview ---------- */
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 8px}
table.summary{width:100%;border-collapse:collapse;margin-top:14px;background:var(--panel);border:1px solid var(--rule)}
table.summary th{font-family:var(--display);text-align:left;font-size:15px;padding:10px 12px;border-bottom:3px solid var(--ink)}
table.summary td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:14.5px}
table.summary td:first-child{font-weight:600;white-space:nowrap}
table.summary td:nth-child(3){white-space:nowrap}
table.summary .linklike{background:none;border:0;color:var(--blue);padding:0;font-weight:700;text-decoration:underline}
.overall{margin:14px 0 0;font-size:16px;font-weight:700}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:34px;max-width:1000px}
.explain h3{font-size:18px;padding-top:9px;border-top:3px solid var(--ink)}
.explain p{margin:6px 0 0;color:var(--ink2);font-size:14.5px}

/* ---------- playground ---------- */
.play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start;margin-top:20px}
.lane-track{display:flex;align-items:center;gap:0;margin:8px 0 18px;min-height:78px;border-bottom:6px solid var(--ink);padding-bottom:6px}
.queue{display:flex;flex-direction:row-reverse;gap:6px;flex:1;justify-content:flex-start;align-items:flex-end;padding-right:14px;flex-wrap:wrap}
.car{background:var(--stop);color:#fff;font-weight:700;border-radius:3px;padding:9px 14px;font-family:var(--display);font-size:18px}
.holders{display:flex;gap:6px;flex-wrap:wrap}
.car.in{background:var(--clear)}
.zone{margin:6px 0 16px}
.zone h3{font-size:16px;margin-bottom:6px}
.tbtns{display:flex;flex-wrap:wrap;gap:10px}
.tbtns .btn{min-width:150px;text-align:left}
.tbtns .btn small{display:block;font-weight:400;color:var(--ink2)}
.hint{color:var(--ink2);font-size:14px;max-width:62ch}

/* ---------- tests ---------- */
.tprog{width:100%;max-width:460px;height:12px;background:#E6EBF2;border-radius:2px;overflow:hidden;margin:14px 0 4px}
.tprog i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}
.tprog.busy i{width:35%!important;animation:tslide 1.1s ease-in-out infinite alternate}
@keyframes tslide{from{transform:translateX(-10%)}to{transform:translateX(200%)}}
#view-playground.busy .tbtns button,#view-playground.busy #pgSig{opacity:.6;pointer-events:none}
.tgroup{margin-top:20px}
.tgroup h3{font-size:16px;padding-top:8px;border-top:2px solid var(--ink)}
.trow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.trow .mk{font-weight:800}.trow.ok .mk{color:var(--clear)}.trow.bad .mk{color:var(--stop)}
.trow code{background:none;padding:0;font-weight:700}
.trow .doc{display:block;color:var(--ink2);font-size:13.5px}
.trow pre{white-space:pre-wrap;font:12px var(--mono);background:var(--wash-stop);padding:8px;margin:6px 0 0}

/* ---------- source ---------- */
.src{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:20px;align-items:start}
.flist{list-style:none;margin:0;padding:0;font-size:14px}
.flist li button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 8px;border-left:4px solid transparent;color:var(--ink)}
.flist li button:hover{background:#E6EBF2}
.flist li button[aria-current=true]{border-left-color:var(--blue);font-weight:700;background:#E6EBF2}
.flist small{color:var(--ink2)}
.code{display:flex;background:#fff;border:1px solid var(--rule);max-height:76vh;overflow:auto;font:13px/1.55 var(--mono)}
.code pre{margin:0;padding:12px 0;white-space:pre}
.code .gut{color:#9AA7BA;text-align:right;padding:12px 10px;user-select:none;border-right:1px solid var(--rule);position:sticky;left:0;background:#F7F9FC}
.code .src-text{padding:12px 16px;min-width:0}
.c{color:#6B7C93;font-style:italic}.s{color:#1B7A4E}.k{color:#2859AC;font-weight:600}.n{color:#A24A0B}

/* ---------- offline / error ---------- */
.fatal{max-width:640px;margin:90px auto;padding:24px;border:3px solid var(--stop);background:#fff}
.fatal h2{color:var(--stop)} .fatal pre{background:#EEF2F7;padding:10px;font:14px var(--mono)}

@media (max-width:1100px){
  .workspace,.play,.src{grid-template-columns:1fr}
  .pc-grid,.rw-grid,.dining{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .summary{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .summary td,.summary th{min-width:90px}
  .summary td[data-k=f]{min-width:220px}
  .btn.big{width:100%}
  .rail{position:static;height:auto;padding:14px 16px}
  .stations{display:flex;flex-wrap:wrap;gap:2px 6px;margin-top:10px}
  .stations::before{display:none}.stations li.gap{margin:0}
  .station{padding:6px 10px}.station::before{display:none}
  .station[aria-current="page"]{background:#1E3150}
  .rail-note{display:none}
  main{padding:20px 16px 50px}
  .lanes,.explain{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><h1>Semaphore lab</h1><p>Operating Systems project</p></div>
    <ol class="stations" id="stations"></ol>
    <p class="rail-note">Everything on this page is driven by the real Python semaphore code running on the server. The page records each run and plays it back.</p>
  </nav>
  <main id="main"></main>
</div>

<script>
"use strict";
/* ============================== helpers ============================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n === null || n === undefined || Number.isNaN(n)) ? '–' : Number(n).toLocaleString('en-US');
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function api(path, opts) {
  const res = await fetch(path, opts);
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch (e) { /* not JSON, e.g. a platform error page */ }
  if (!res.ok) throw new Error((data && data.error) || `${res.status} ${res.statusText || 'request failed'}`.trim());
  if (data === null) throw new Error('The server returned an unexpected response.');
  return data;
}
const post = (path, body, signal) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {}), signal});

function fatal(msg) {
  document.body.innerHTML = `<div class="fatal"><h2>Could not reach the Python backend</h2>
  <p>${esc(msg)}</p><p>On Vercel, check the deployment's Functions logs. To run it on your own computer, open a terminal in the project folder and run:</p><pre>python server.py</pre>
  <p>Then open <b>http://localhost:8000</b> in your browser.</p></div>`;
}

/* The signal gauge: arm horizontal + red = stop (value 0), arm lowered + green = clear. */
function gauge(name, s, max, big) {
  s = s || {value: '–', waiting: 0};
  const clear = typeof s.value === 'number' && s.value > 0;
  const w = s.waiting || 0;
  const cars = '<i></i>'.repeat(Math.min(w, 8)) + (w > 8 ? `<em>+${w - 8}</em>` : '');
  const maxTxt = max ? `<span class="sig-q" style="color:var(--ink2)">of ${max} permits</span>` : '';
  return `<div class="sig ${clear ? 'clear' : 'stop'} ${big ? 'big' : ''}" role="img" aria-label="${esc(name)}: value ${s.value}, ${w} thread(s) blocked">
    <svg viewBox="0 0 56 56" width="46" height="46" aria-hidden="true">
      <rect x="26" y="7" width="4" height="46" fill="#56657A"/><rect x="19" y="50" width="18" height="4" fill="#56657A"/>
      <g style="transform-origin:28px 12.5px;transform:rotate(${clear ? 38 : 0}deg)">
        <rect class="arm" x="28" y="9" width="24" height="7" rx="1.5"/><rect x="43" y="9" width="5" height="7" fill="#fff" opacity=".85"/></g>
      <circle class="lamp" cx="28" cy="7" r="4.5"/></svg>
    <div class="sig-txt"><span class="sig-name">${esc(name)}</span><span class="sig-val">${s.value}</span>${maxTxt}
      <span class="sig-q">${w ? cars + ' blocked' : 'none blocked'}</span></div></div>`;
}

const STATUS_TEXT = {working: 'working', blocked: 'blocked', active: 'in buffer', done: 'done', aborted: 'stopped',
  idle: 'idle', waiting: 'waiting', reading: 'reading', writing: 'writing', thinking: 'thinking', hungry: 'hungry',
  eating: 'eating', deadlocked: 'deadlocked'};
function actorRows(map, blockedText, countLabel) {
  return Object.entries(map || {}).map(([name, a]) => {
    const st = a.status || 'idle';
    const label = (st === 'blocked' && blockedText) ? blockedText : (STATUS_TEXT[st] || st);
    return `<li class="actor st-${st}"><span class="dot"></span><span class="who"><b>${esc(name)}</b><small>${countLabel}: ${a.count ?? a.ops ?? 0}</small></span><span class="stt">${esc(label)}</span></li>`;
  }).join('');
}

/* =========================== demo renderers =========================== */
const RENDER = {};

RENDER.race = {
  setup(stage) {
    stage.innerHTML = `<div class="lanes">

async function startDemo(v) {
  const q = k => $(`[data-k=${k}]`, v.el);
  const runId = ++v.runId, ctrl = new AbortController();
  if (v.ctrl) v.ctrl.abort();
  v.ctrl = ctrl;
  v.events = {main: [], sem: []};
  renderEvents(v, true);
  RENDER[v.meta.id].update(q('stage'), {});
  q('verify').innerHTML = '<h3>Verification</h3><p class="muted">The Python threads are running on the server. The animation starts when the run finishes...</p>';
  q('run').disabled = true; q('stop').disabled = false; setBadge(v, 'running', 'Running');
  const stopped = () => { setBadge(v, 'cancelled', 'Stopped'); q('verify').innerHTML = '<h3>Verification</h3><p class="muted">Stopped. Press Run to start again.</p>'; };
  try {
    const d = await post('/api/run', {demo: v.meta.id, params: collectParams($('form', v.el)), record: true}, ctrl.signal);
    if (v.runId !== runId) return;
    setBadge(v, 'running', 'Replaying');
    q('verify').innerHTML = '<h3>Verification</h3><p class="muted">Replaying the recorded run at real speed...</p>';
    const finished = await replay(d, ctrl.signal, (evs, state) => {
      addEvents(v, evs);
      RENDER[v.meta.id].update(q('stage'), state);
    });
    if (v.runId !== runId) return;
    if (!finished) return stopped();
    if (d.error) { setBadge(v, 'fail', 'Error'); q('verify').innerHTML = `<h3>Verification</h3><pre class="muted">${esc(d.error)}</pre>`; return; }
    showResult(v, d.result);
  } catch (e) {
    if (v.runId !== runId) return;
    if (e.name === 'AbortError') return stopped();
    setBadge(v, 'fail', 'Error'); q('verify').innerHTML = `<h3>Verification</h3><p class="muted">${esc(e.message)}</p>`;
  } finally {
    if (v.runId === runId) { q('run').disabled = false; q('stop').disabled = true; v.ctrl = null; }
  }
}

/* Play back the recorded frames at the speed the real threads ran. */
async function replay(d, signal, onFrame) {
  const frames = d.frames || [], events = d.events || [];
  const t0 = performance.now();
  let shown = 0;
  for (let i = 0; i < frames.length; i++) {
    if (signal.aborted) return false;
    const f = frames[i], last = i === frames.length - 1;
    const wait = f.t * 1000 - (performance.now() - t0);
    if (wait > 0 && !last) await sleep(wait);
    if (signal.aborted) return false;
    const upto = last ? events.length : Math.min(f.seq, events.length);
    onFrame(events.slice(shown, upto), f.state || {});
    shown = Math.max(shown, upto);
  }
  return true;
}

function showResult(v, r) {
  const q = k => $(`[data-k=${k}]`, v.el);
  const cls = {PASS: 'pass', FAIL: 'fail', DEADLOCK: 'deadlock', CANCELLED: 'cancelled'}[r.status] || 'fail';
  setBadge(v, cls, r.status === 'PASS' ? 'Passed' : r.status === 'DEADLOCK' ? 'Deadlock' : r.status === 'CANCELLED' ? 'Stopped' : 'Failed');
  const items = r.checks.map(c => `<li class="${c.info ? 'info' : c.ok ? 'ok' : 'bad'}"><span class="mk" aria-label="${c.info ? 'info' : c.ok ? 'passed' : 'failed'}">${c.info ? 'i' : c.ok ? '✓' : '✗'}</span><span>${esc(c.name)}${c.detail ? `<span class="d">${esc(c.detail)}</span>` : ''}</span></li>`).join('');
  const stats = Object.entries(r.stats).map(([k, val]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(Array.isArray(val) ? val.map(fmt).join(', ') : typeof val === 'number' ? fmt(val) : String(val))}</dd>`).join('');

}

  } catch (e) { rowSet('tests', 'fail', 'Error', '–', e.message); }
  finally { btns.forEach(b => b.disabled = false); }
}

async function runAll() {
  const btns = $$('#runAll,#runTests'); btns.forEach(b => b.disabled = true);
  $('#overall').textContent = 'Running...';
  let passed = 0;
  try {
    for (const d of App.demos) {
      rowSet(d.id, 'running', 'Running', '–', 'Running...');
      const r = await runToEnd({demo: d.id, params: {}});
      const [cls, text] = BADGE[r.status] || BADGE.FAIL;
      rowSet(d.id, cls, text, r.duration.toFixed(2) + ' s', FACTS[d.id](r.stats) + (r.status === 'DEADLOCK' ? ' Watchdog detected a deadlock.' : ''));
      if (r.status === 'PASS') passed++;
    }
  } catch (e) { $('#overall').textContent = 'Error: ' + e.message; btns.forEach(b => b.disabled = false); return; }
  btns.forEach(b => b.disabled = false);
  const t = await runTestsOverview();
  const n = App.demos.length;
  $('#overall').textContent = `${passed} of ${n} demonstrations passed` + (t ? `, ${t.passed} of ${t.total} unit tests passed.` : '.');
}

/* ------------------------------- playground ------------------------------- */
const Playground = {
  built: false, initial: 1, actions: [], t0: performance.now(), busy: false,
  build() {
    const sec = document.createElement('section'); sec.className = 'view'; sec.id = 'view-playground';
    sec.innerHTML = `<header class="vhead"><h2>Playground</h2><p class="lede">Operate a real semaphore by hand. Each button calls <code>wait()</code> or <code>signal()</code> on the Python <code>Semaphore</code> object, from a separate thread.</p></header>
      <form class="controls" id="pgForm"><label class="f">Initial value<input type="number" id="pgInit" min="0" max="5" value="1"></label>
        <div class="actions"><button type="submit" class="btn primary">New semaphore</button></div></form>
      <div class="play"><div class="stage">
        <div class="gauges" id="pgGauge"></div>
        <div class="zone"><h3>Blocked queue (front of the line is on the right)</h3>
          <div class="lane-track"><div class="queue" id="pgQueue"></div></div></div>
        <div class="zone"><h3>Threads</h3><div class="tbtns" id="pgBtns"></div>
          <p class="hint" style="margin-top:12px">Try it: start with value 1. Press <b>A</b> wait() (A gets the permit), then B, then C (they queue up). Now press A signal(): the permit goes straight to B, and the counter stays at 0.</p></div>
        <div class="zone"><button class="btn" id="pgSig">signal() from outside</button> <span class="hint">adds a permit, or wakes the thread at the front</span></div></div>
        <aside class="side"><section><h3>Semaphore trace</h3><ol class="events" id="pgTrace"></ol></section></aside></div>`;
    $('#main').appendChild(sec);
    $('#pgForm').addEventListener('submit', e => {
      e.preventDefault();
      const n = Math.max(0, Math.min(5, Math.round(Number($('#pgInit').value) || 0)));
      $('#pgInit').value = n;
      this.initial = n; this.actions = []; this.t0 = performance.now();
      this.refresh();
    });
    $('#pgSig').addEventListener('click', () => this.act({action: 'signal'}));
    $('#pgBtns').addEventListener('click', e => {
      const b = e.target.closest('button[data-act]'); if (b) this.act({action: b.dataset.act, name: b.dataset.name});
    });
    this.built = true;
  },
  /* The server is stateless: every request replays all actions on a fresh, real Semaphore. */
  async act(body) {
    if (this.busy) return;
    this.actions.push({...body, t: (performance.now() - this.t0) / 1000});
    if (!(await this.refresh())) this.actions.pop();
  },
  async refresh() {
    this.busy = true; $('#view-playground').classList.add('busy');
    try { this.render(await post('/api/playground', {initial: this.initial, actions: this.actions})); return true; }
    catch (e) { $('#pgTrace').innerHTML = `<li><span class="empty">Error: ${esc(e.message)}</span></li>`; return false; }
    finally { this.busy = false; $('#view-playground').classList.remove('busy'); }
  },
  render(s) {
    $('#pgGauge').innerHTML = gauge('sem', {value: s.value, waiting: s.waiting}, null, true);
    $('#pgQueue').innerHTML = s.queue.map(n => `<span class="car">${n}</span>`).join('') || '<span class="muted">Nobody is waiting.</span>';
    $('#pgBtns').innerHTML = Object.entries(s.threads).map(([n, st]) => {
      if (st === 'blocked') return `<button class="btn" disabled>Thread ${n}<small>blocked in wait()</small></button>`;
      if (st === 'holding') return `<button class="btn" data-act="release" data-name="${n}">Thread ${n}: signal()<small>holds a permit, press to release</small></button>`;
      return `<button class="btn primary" data-act="wait" data-name="${n}">Thread ${n}: wait()<small>${st === 'released' ? 'released earlier' : 'idle'}</small></button>`;
    }).join('');
    $('#pgTrace').innerHTML = s.trace.map(eventLi).join('') || '<li><span class="empty">No operations yet.</span></li>';
    const t = $('#pgTrace'); t.scrollTop = t.scrollHeight;
  }
};

/* --------------------------------- tests --------------------------------- */
const Tests = {
  build() {
    const sec = document.createElement('section'); sec.className = 'view'; sec.id = 'view-tests';
    sec.innerHTML = `<header class="vhead"><h2>Unit tests</h2><p class="lede">The automated tests of the semaphore and of the four demonstrations. Each line says what behaviour it verifies.</p></header>
      <div class="hero-actions"><button class="btn primary" id="tRun">Run unit tests</button></div>
      <div class="tprog" aria-hidden="true"><i id="tBar"></i></div><p class="overall" id="tSum" aria-live="polite"></p><div id="tList"></div>`;
    $('#main').appendChild(sec);
    $('#tRun').addEventListener('click', async () => {
      const btn = $('#tRun'); btn.disabled = true; $('#tSum').textContent = 'Running the test suite on the server...'; $('#tSum').style.color = ''; $('#tList').innerHTML = '';
      $('#tBar').style.width = '0'; $('.tprog').classList.add('busy');
      try {
        this.render(await runToEnd({kind: 'tests'}));
      } catch (e) { $('#tSum').textContent = 'Error: ' + e.message; $('#tSum').style.color = 'var(--stop)'; }
      finally { btn.disabled = false; $('.tprog').classList.remove('busy'); }
    });
  },
  render(r) {
    $('.tprog').classList.remove('busy');

    const sum = $('#tSum');
    sum.textContent = r.ok ? `All ${r.total} tests passed in ${r.duration.toFixed(1)} s.` : `${r.failed + r.errors} of ${r.total} tests failed.`;
    sum.style.color = r.ok ? 'var(--clear)' : 'var(--stop)';
    const groups = {};
    r.rows.forEach(t => (groups[t.cls] = groups[t.cls] || []).push(t));
    $('#tList').innerHTML = Object.entries(groups).sort().map(([cls, rows]) => `<div class="tgroup"><h3>${esc(cls)}</h3>${rows.sort((a, b) => a.name.localeCompare(b.name)).map(t =>
      `<div class="trow ${t.status === 'ok' ? 'ok' : 'bad'}"><span class="mk">${t.status === 'ok' ? '✓' : '✗'}</span><span><code>${esc(t.name)}</code><span class="doc">${esc(t.doc)}</span>${t.detail ? `<pre>${esc(t.detail)}</pre>` : ''}</span></div>`).join('')}</div>`).join('');
  }
};

/* ------------------------------ source viewer ------------------------------ */
const KW = new Set('def class return if elif else for while in not and or is import from as with try except finally raise pass break continue lambda yield None True False self global nonlocal assert del'.split(' '));
function highlightPy(src) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|f?"(?:\\.|[^"\\\n])*"|f?'(?:\\.|[^'\\\n])*')|\b([A-Za-z_][A-Za-z0-9_]*)\b|(\b\d+(?:\.\d+)?\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += KW.has(m[3]) ? `<span class="k">${m[3]}</span>` : esc(m[3]);
    else out += `<span class="n">${m[4]}</span>`;
  }
  return out + esc(src.slice(last));
}
const Source = {
  files: null, current: 'src/semaphore.py',
  build() {
    const sec = document.createElement('section'); sec.className = 'view'; sec.id = 'view-source';
    sec.innerHTML = `<header class="vhead"><h2>Source code</h2><p class="lede">The exact files that run the demonstrations. Start with <code>src/semaphore.py</code>: the comments at the top explain the algorithm.</p></header>
      <div class="src"><ul class="flist" id="sFiles"></ul><div class="code" id="sCode" tabindex="0" aria-label="Source code"></div></div>`;
    $('#main').appendChild(sec);
    $('#sFiles').addEventListener('click', e => { const b = e.target.closest('button[data-f]'); if (b) this.load(b.dataset.f); });
  },
  async open() {
    if (!this.files) {
      try { this.files = await api('/api/source'); } catch (e) { $('#sCode').textContent = 'Could not load the file list: ' + e.message; return; }
      $('#sFiles').innerHTML = this.files.map(f => `<li><button data-f="${f.file}">${esc(f.file)} <small>${f.lines}</small></button></li>`).join('');
    }
    this.load(this.current);
  },
  async load(file) {
    this.current = file;
    $$('#sFiles button').forEach(b => b.setAttribute('aria-current', b.dataset.f === file ? 'true' : 'false'));
    try {
      const d = await api('/api/source?file=' + encodeURIComponent(file));
      const lines = d.text.split('\n').length;
      $('#sCode').innerHTML = `<pre class="gut">${Array.from({length: lines}, (_, i) => i + 1).join('\n')}</pre><pre class="src-text">${file.endsWith('.py') ? highlightPy(d.text) : esc(d.text)}</pre>`;
      $('#sCode').scrollTop = 0;
    } catch (e) { $('#sCode').textContent = e.message; }
  }
};

/* ---------------------------------- boot ---------------------------------- */
async function boot() {
  if (location.protocol === 'file:') return fatal('This page was opened as a file, but it needs the Python backend to run the semaphores.');
  try { App.demos = await api('/api/catalog'); } catch (e) { return fatal(e.message); }
  $('#stations').innerHTML = NAV.map(n => `<li class="${n.gap ? 'gap' : ''}"><button class="station" data-id="${n.id}">${esc(n.label)}</button></li>`).join('');
  $('#stations').addEventListener('click', e => { const b = e.target.closest('.station'); if (b) show(b.dataset.id); });
  buildOverview();
  App.demos.forEach(buildDemoView);
  Playground.build(); Tests.build(); Source.build();
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || 'overview');
}
boot();
