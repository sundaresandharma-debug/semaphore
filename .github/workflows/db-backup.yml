# Nightly encrypted backup of the Supabase database.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     the "Session pooler" connection string from Supabase (Connect button)
#   BACKUP_PASSPHRASE   a long random passphrase; keep a copy somewhere safe
# Each backup is stored as a workflow artifact for 14 days, encrypted with the passphrase.
name: Database backup

on:
  schedule:
    - cron: "17 21 * * *"        # 02:47 India time, every day
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: check
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "Backup skipped: add SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump, compress and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          docker run --rm -e DB postgres:17 sh -c 'pg_dump --no-owner --no-privileges --schema=public --schema=auth "$DB"' \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 \
                  -o "semaphore-db-$stamp.sql.gz.gpg"
          ls -l semaphore-db-*.gpg

      - name: Keep for 14 days
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semaphore-db-backup
          path: semaphore-db-*.sql.gz.gpg
          retention-days: 14
          if-no-files-found: error
